<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SLX — локальні показники</title>
  <link rel="stylesheet" href="style.css">
  <script src="metrics.js" defer></script>
</head>
<body class="product-page">
  <main class="shell standalone" id="metrics-report">
    <a href="index.html" class="detail-link">На головну SLX</a>
    <h1>Локальні показники</h1>
    <p class="muted">Дані цього браузера. Кожен крок враховується один раз за сесію вкладки.</p>
    <dl class="metrics-grid">
      <div><dt>Відкриття головної</dt><dd data-total="landing_view">0</dd></div>
      <div><dt>Натиснули «До каталогу»</dt><dd data-total="drop_click">0</dd></div>
      <div><dt>Підписалися на новини</dt><dd data-total="newsletter_request">0</dd></div>
      <div><dt>Запросили сповіщення про річ</dt><dd data-total="product_notify_request">0</dd></div>
      <div><dt>CTR кнопки каталогу</dt><dd id="local-ctr">—</dd></div>
    </dl>
  </main>
</body>
</html>
