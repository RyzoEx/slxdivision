<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SLX — local metrics</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="commerce.css">
  <script src="/analytics.js" defer></script>
  <script src="metrics.js" defer></script>
</head>
<body class="product-page">
  <main class="shell standalone" id="metrics-report">
    <a href="index.html" class="detail-link">SLX home</a>
    <button class="text-button" type="button" data-cookie-settings>Cookie settings</button>
    <h1>Local metrics</h1>
    <p class="muted">Browser-only data. Each step is counted once per tab session.</p>
    <dl class="metrics-grid">
      <div><dt>Home visits</dt><dd data-total="landing_view">0</dd></div>
      <div><dt>Collection link clicks</dt><dd data-total="drop_click">0</dd></div>
      <div><dt>Newsletter signups</dt><dd data-total="newsletter_request">0</dd></div>
      <div><dt>Product notifications requested</dt><dd data-total="product_notify_request">0</dd></div>
      <div><dt>Collection link CTR</dt><dd id="local-ctr">—</dd></div>
    </dl>
  </main>
</body>
</html>
